<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Гонки</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, sans-serif; background: #000; overflow: hidden; height: 100vh; }
  #canvas-container { width: 100%; height: 100%; display: block; }
  
  /* HUD */
  #status { position: absolute; top: 10px; right: 15px; color: #888; font-size: 14px; z-index: 10; font-weight: bold; }
  #speedometer { position: absolute; bottom: 160px; right: 20px; color: #fff; font-size: 24px; font-weight: bold; z-index: 10; text-shadow: 0 0 5px #000; }
  
  /* Чат */
  #chat { position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; display: flex; flex-direction: column; background: rgba(15, 22, 38, 0.9); z-index: 10; border-top: 1px solid #333; }
  #chatlog { flex: 1; overflow-y: auto; padding: 6px 10px; font-size: 13px; color: #ccc; }
  #chatlog .me { color: #ffd700; }
  #chatinput { display: flex; border-top: 1px solid #333; }
  #chatinput input { flex: 1; padding: 10px; border: none; background: #16213e; color: #fff; font-size: 14px; outline: none; }
  #chatinput button { padding: 10px 16px; border: none; background: #4361ee; color: #fff; font-weight: bold; }

  /* Джойстик */
  #joystick-container { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; z-index: 10; display: none; touch-action: none; }
  #joystick-base { width: 100%; height: 100%; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); position: relative; }
  #joystick-stick { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.5); position: absolute; left: 35px; top: 35px; pointer-events: none; }
  
  @media (pointer: coarse) { #joystick-container { display: block; } }
</style>
</head>
<body>

<div id="status">подключение...</div>
<div id="speedometer">0 км/ч</div>

<div id="joystick-container">
  <div id="joystick-base"><div id="joystick-stick"></div></div>
</div>

<div id="chat">
  <div id="chatlog"></div>
  <div id="chatinput">
    <input id="msg" placeholder="Написать сообщение..." maxlength="50">
    <button id="send">➤</button>
  </div>
</div>

<div id="canvas-container"></div>

<!-- Подключаем Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ===== АДРЕС СЕРВЕРА (уже вставлен) =====
const WS_URL = 'wss://sandbank-economic-zeppelin.ngrok-free.dev';

// ===================================================
// СЕТЕВАЯ ЧАСТЬ
// ===================================================
let ws = null;
let myId = null;
let players = {};

const statusEl = document.getElementById('status');
const chatlog = document.getElementById('chatlog');
const msgInput = document.getElementById('msg');
const sendBtn = document.getElementById('send');

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { statusEl.textContent = '🟢 онлайн'; statusEl.style.color = '#4caf50'; };
  ws.onclose = () => {
    statusEl.textContent = '🔴 офлайн'; statusEl.style.color = '#f44336';
    setTimeout(connect, 2000);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'init') {
      myId = msg.id;
      players = msg.players;
      if (players[myId]) {
        car.position.x = players[myId].x;
        car.position.z = players[myId].z;
        car.rotation.y = players[myId].rot;
      }
    }
    if (msg.type === 'players') {
      players = msg.players;
    }
    if (msg.type === 'chat') {
      const div = document.createElement('div');
      if (msg.id === myId) div.className = 'me';
      div.textContent = `${msg.name}: ${msg.text}`;
      chatlog.appendChild(div);
      chatlog.scrollTop = chatlog.scrollHeight;
    }
  };
}

function sendMove() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: 'move',
      x: car.position.x,
      z: car.position.z,
      rot: car.rotation.y
    }));
  }
}

// Чат
sendBtn.onclick = sendChat;
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChat();
  e.stopPropagation();
});
function sendChat() {
  const text = msgInput.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'chat', text }));
  msgInput.value = '';
}

// ===================================================
// 3D ГРАФИКА (THREE.JS)
// ===================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 50, 200);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// Освещение
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(50, 100, 50);
dirLight.castShadow = true;
dirLight.shadow.camera.top = 100;
dirLight.shadow.camera.bottom = -100;
dirLight.shadow.camera.left = -100;
dirLight.shadow.camera.right = 100;
scene.add(dirLight);

// Земля
const groundGeo = new THREE.PlaneGeometry(500, 500);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Трасса
const roadGeo = new THREE.PlaneGeometry(30, 500);
const roadMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.01;
road.receiveShadow = true;
scene.add(road);

// Разметка
for (let i = -240; i < 250; i += 10) {
  const lineGeo = new THREE.PlaneGeometry(1, 4);
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const line = new THREE.Mesh(lineGeo, lineMat);
  line.rotation.x = -Math.PI / 2;
  line.position.set(0, 0.02, i);
  scene.add(line);
}

// Конусы
const coneMat = new THREE.MeshLambertMaterial({ color: 0xff6600 });
const coneGeo = new THREE.ConeGeometry(2, 5, 8);
for (let i = 0; i < 20; i++) {
  const cone = new THREE.Mesh(coneGeo, coneMat);
  cone.position.set((Math.random() - 0.5) * 20, 2.5, (Math.random() - 0.5) * 400);
  cone.castShadow = true;
  scene.add(cone);
}

// Функция создания 3D-машинки
function createCar(color) {
  const carGroup = new THREE.Group();
  
  const bodyGeo = new THREE.BoxGeometry(4, 2, 8);
  const bodyMat = new THREE.MeshLambertMaterial({ color: color });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 1.5;
  body.castShadow = true;
  carGroup.add(body);

  const roofGeo = new THREE.BoxGeometry(3, 1.5, 4);
  const roofMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.set(0, 3, -1);
  roof.castShadow = true;
  carGroup.add(roof);

  const wheelGeo = new THREE.CylinderGeometry(1, 1, 0.8, 16);
  const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  
  const wheelPositions = [
    [-2, 0.5, 2.5], [2, 0.5, 2.5],
    [-2, 0.5, -2.5], [2, 0.5, -2.5]
  ];
  
  wheelPositions.forEach(pos => {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(pos[0], pos[1], pos[2]);
    wheel.castShadow = true;
    carGroup.add(wheel);
  });

  return carGroup;
}

// Моя машинка
let car = createCar(0xffd700);
scene.add(car);

const otherCars = {};

// ===================================================
// УПРАВЛЕНИЕ
// ===================================================
const keys = { w: false, a: false, s: false, d: false };
let speed = 0;
const maxSpeed = 0.8;
const accel = 0.02;
const friction = 0.98;
const turnSpeed = 0.04;

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
    keys[k] = true;
  }
  if (e.key === 'Enter' && document.activeElement !== msgInput) msgInput.focus();
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
    keys[k] = false;
  }
});

// Джойстик
const joyContainer = document.getElementById('joystick-container');
const joyBase = document.getElementById('joystick-base');
const joyStick = document.getElementById('joystick-stick');
let joyActive = false;
let joyVec = { x: 0, y: 0 };

joyContainer.addEventListener('touchstart', (e) => { e.preventDefault(); joyActive = true; updateJoy(e.touches[0]); });
joyContainer.addEventListener('touchmove', (e) => { e.preventDefault(); if (joyActive) updateJoy(e.touches[0]); });
joyContainer.addEventListener('touchend', (e) => {
  e.preventDefault(); joyActive = false; joyVec = { x: 0, y: 0 };
  joyStick.style.left = '35px'; joyStick.style.top = '35px';
});

function updateJoy(touch) {
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = touch.clientX - cx;
  let dy = touch.clientY - cy;
  const max = rect.width / 2 - 25;
  const dist = Math.hypot(dx, dy);
  if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
  joyStick.style.left = (rect.width / 2 - 25 + dx) + 'px';
  joyStick.style.top = (rect.height / 2 - 25 + dy) + 'px';
  joyVec.x = dx / max;
  joyVec.y = dy / max;
}

// ===================================================
// ИГРОВОЙ ЦИКЛ
// ===================================================
const speedEl = document.getElementById('speedometer');
let lastSend = 0;

function animate() {
  requestAnimationFrame(animate);

  let moveForward = 0;
  let turn = 0;

  if (keys['w'] || keys['arrowup']) moveForward += 1;
  if (keys['s'] || keys['arrowdown']) moveForward -= 1;
  if (keys['a'] || keys['arrowleft']) turn -= 1;
  if (keys['d'] || keys['arrowright']) turn += 1;

  if (Math.abs(joyVec.y) > 0.1) moveForward += -joyVec.y;
  if (Math.abs(joyVec.x) > 0.1) turn += joyVec.x;

  if (moveForward > 0) speed += accel;
  else if (moveForward < 0) speed -= accel;
  else speed *= friction;

  speed = Math.max(-maxSpeed/2, Math.min(maxSpeed, speed));

  if (Math.abs(speed) > 0.01) {
    car.rotation.y -= turn * turnSpeed * (speed > 0 ? 1 : -1);
    car.position.x += Math.sin(car.rotation.y) * speed;
    car.position.z += Math.cos(car.rotation.y) * speed;
  }

  car.position.x = Math.max(-200, Math.min(200, car.position.x));
  car.position.z = Math.max(-240, Math.min(240, car.position.z));

  const camDist = 12;
  const camHeight = 6;
  const targetCamPos = new THREE.Vector3(
    car.position.x - Math.sin(car.rotation.y) * camDist,
    car.position.y + camHeight,
    car.position.z - Math.cos(car.rotation.y) * camDist
  );
  camera.position.lerp(targetCamPos, 0.1);
  camera.lookAt(car.position.x, car.position.y + 2, car.position.z);

  speedEl.textContent = Math.round(Math.abs(speed) * 100) + ' км/ч';

  for (const id in players) {
    if (Number(id) === myId) continue;
    if (!otherCars[id]) {
      otherCars[id] = createCar(players[id].color);
      scene.add(otherCars[id]);
    }
    const other = otherCars[id];
    other.position.x += (players[id].x - other.position.x) * 0.2;
    other.position.z += (players[id].z - other.position.z) * 0.2;
    other.rotation.y += (players[id].rot - other.rotation.y) * 0.2;
  }

  for (const id in otherCars) {
    if (!players[id]) {
      scene.remove(otherCars[id]);
      delete otherCars[id];
    }
  }

  const now = Date.now();
  if (now - lastSend > 50) {
    lastSend = now;
    sendMove();
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

connect();
animate();
</script>
</body>
</html>
